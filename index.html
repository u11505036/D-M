function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

['向服務臺問路','走廊裡有工作人員。你要讓對方願意聽、聽得清楚，也知道如何幫忙。',[20,22,21,23],['取得對方回應','依對方提示調整站位','環境變吵，讓對方聽清楚','具體說出需要的方向資訊']],
['換一種方式求助','你已經準備好求助錄音。現在口頭表達費力，請完成這次問路。',[24,23],['先用工具傳送求助內容','對方追問需要什麼，補上具體地標問題']]
];
let chapter=0, logs=missions.map(()=>[]), mistakes=missions.map(()=>[]),selected=null,msg='',view='home';
const app=document.getElementById('app'),hero=(tag,title,desc)=>'<section class="hero"><span class="tag">'+tag+'</span><h1>'+title+'</h1><p>'+desc+'</p></section>';
function home(){view='home';app.innerHTML=hero('校園探索　／　教學卡牌','校園定向手札','用一手技法牌，把身體、環境與他人的線索拼成一段路。')+'<h2>三組牌怎麼用？</h2><div class="hand">'+['概念發展｜先確立參照點，說清楚誰相對於誰。','感官知覺｜提取聲音、觸感與動作線索，建立心理地圖。','溝通技能｜調整互動方式，取得缺少的方向資訊。'].map((s,i)=>'<div class="card board"><small>牌組 '+(i+1)+'</small><b>'+s.split('｜')[0]+'</b>'+s.split('｜')[1]+'</div>').join('')+'</div><p>選一張牌查看定義，再打出它。得到的線索會留在桌面，講解完再繼續。</p><div class="row"><button class="primary" onclick="openMission(chapter)">進入牌桌 →</button><button onclick="summaryPage()">查看統整表</button></div>'}
function openMission(i){chapter=Number(i);selected=null;msg='';view='play';render()}
function render(){const [name,desc,ids,goals]=missions[chapter],step=logs[chapter].length,finished=step===ids.length;
let pool=[...new Set([...ids,(ids[0]+7)%25,(ids[0]+14)%25])].sort((a,b)=>(a*13+chapter)%29-(b*13+chapter)%29);
app.innerHTML='<div class="row"><button onclick="home()">首頁</button><label>切換情境 <select onchange="openMission(this.value)">'+missions.map((m,i)=>'<option '+(chapter===i?'selected':'')+' value="'+i+'">'+(i+1)+' · '+m[0]+'</option>').join('')+'</select></label><button onclick="summaryPage()">總結與統整</button></div>'+hero('校園任務　'+(chapter+1)+' / 8',name,desc)+lab()+'<section class="board"><b>桌面線索　'+step+' / '+ids.length+'</b><div class="route">'+ids.map((id,i)=>'<span class="slot '+(i<step?'done':'')+'">'+(i<step?'✓ '+cards[id][3]:'◇ '+(i+1))+'</span>').join('')+'</div></section>'+
(finished?'<h2>本關總結</h2><p>'+logs[chapter].map(id=>cards[id][3]).join(' → ')+'。</p><div class="row"><button class="primary" onclick="'+(chapter<7?'openMission(chapter+1)':'summaryPage()')+'">'+(chapter<7?'下一個情境 →':'看最終統整 →')+'</button></div>':'<h2>'+goals[step]+'</h2><p>從手牌選擇你想執行的動作。</p><div class="hand">'+pool.filter(id=>!logs[chapter].includes(id)).map(id=>'<button class="card '+(selected===id?'sel':'')+'" aria-pressed="'+(selected===id)+'" onclick="choose('+id+')"><small>'+groups[family(id)]+'</small><b>'+cards[id][0]+'</b>'+cards[id][2]+'</button>').join('')+'</div>')+
'<div aria-live="polite" class="note">'+(msg||'等待出牌。')+(selected!==null?' <button class="primary" onclick="play()">打出這張牌</button>':'')+'</div><button onclick="resetRound()">重玩本關</button>'}
let facing=0, sounds=[];
function turn(){facing=1-facing;render()}
function tone(kind){try{const a=new AudioContext();a.resume();const t=a.currentTime;[0,.18,.36].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=kind?'triangle':'sine';o.frequency.value=kind?[330,415,494][i]:[880,880,880][i];g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.13,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.15);o.connect(g);g.connect(a.destination);o.start(t+d);o.stop(t+d+.16)});setTimeout(()=>a.close(),850)}catch{}}
function sound(k){sounds.push(k);tone(k);render()}
function lab(){if(chapter===0)return '<section class="board"><b>參照點實驗</b><p>書櫃 ▧　｜　講桌 ▤</p><p>你目前面向'+(facing?'後牆 ↓，書櫃在你右側':'講桌 ↑，書櫃在你左側')+'。書櫃與講桌仍然相鄰。</p><button onclick="turn()">打出「轉身 180°」</button></section>';if(chapter===2)return '<section class="board"><b>加演 · 聲音路線編排</b><p>依你希望經過的順序出牌，再重播比較。示範音為合成提示音。</p><div class="row"><button onclick="sound(0)">加入校鈴 ♪</button><button onclick="sound(1)">加入琴音 ♫</button><button onclick="sounds.forEach((k,i)=>setTimeout(()=>tone(k),i*800))" '+(!sounds.length?'disabled':'')+'>重播路線</button><button onclick="sounds=[];render()">清空路線</button></div><p>'+ (sounds.map(k=>k?'琴音':'校鈴').join(' → ')||'尚未放置聲音地標')+'</p></section>';return ''}
function choose(id){selected=id;msg='<b>'+cards[id][0]+'</b>　'+cards[id][1];render()}
function play(){if(selected===null)return;const id=selected,step=logs[chapter].length,goal=missions[chapter][3][step];selected=null;if(id===missions[chapter][2][step]){logs[chapter].push(id);msg='✓ '+cards[id][2]+' → '+cards[id][3]+'。'+cards[id][1]}else{mistakes[chapter].push(id);msg='這張牌能「'+cards[id][2]+'」，目前要先「'+goal+'」。保留原有線索，可以換牌再試。'}render()}
function resetRound(){if(chapter===0)facing=0;if(chapter===2)sounds=[];logs[chapter]=[];mistakes[chapter]=[];openMission(chapter)}
function summaryPage(){view='summary';app.innerHTML=hero('課堂回顧','這一局的定向線索','從桌上的行動，回到教材中的技法。')+'<div class="row"><button onclick="openMission(chapter)">返回牌桌</button><button onclick="home()">首頁</button></div><h2>出牌紀錄</h2>'+missions.map((m,i)=>logs[i].length||mistakes[i].length?'<p><b>'+m[0]+'</b>　'+logs[i].map(id=>cards[id][3]).join(' → ')+'　｜ 修正 '+mistakes[i].length+' 次</p>':'').join('')+(logs.every(l=>!l.length)&&mistakes.every(l=>!l.length)?'<p>尚未出牌。可先展開下方牌組備課。</p>':'')+'<h2>三組技法統整</h2>'+groups.map((g,k)=>'<details open><summary>'+g+'</summary><div class="wrap"><table><thead><tr><th>教材技法</th><th>定義與辨別</th><th>情境動作</th></tr></thead><tbody>'+cards.map((c,id)=>family(id)===k?'<tr><th>'+((id<3?'身體的覺察 · ':id>=7&&id<=13?'聽覺 · ':id>=14&&id<=16?'觸覺 · ':''))+c[0]+'</th><td>'+c[1]+'</td><td>'+c[2]+'</td></tr>':'').join('')+'</tbody></table></div></details>').join('')}
home();
</script></html>
